# Builds the images that self-enrolling pool servers pull, and publishes them to
# GitHub's container registry as ghcr.io/<owner>/pool-<name>.
name: images

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "migrations/**"
      - "config/production.toml"
      - "docker/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The pool's own services share one Dockerfile and differ by build target.
          - name: stratum
            context: .
            file: docker/pool/Dockerfile
            target: stratum
          - name: core
            context: .
            file: docker/pool/Dockerfile
            target: core
          # Coin daemons: release binaries pinned by checksum.
          - name: dogecoin
            context: docker/dogecoin
            file: docker/dogecoin/Dockerfile
          - name: spacexpanse
            context: docker/spacexpanse
            file: docker/spacexpanse/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Registry paths must be lower case; account names need not be.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pool-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
