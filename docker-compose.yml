# Local development only. Everything binds to loopback on non-default ports
# so it does not collide with other projects on this machine.
name: pool-dev

services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: pool
      POSTGRES_PASSWORD: pooldev
      POSTGRES_DB: pool
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pool -d pool"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Regtest: a private chain with instant blocks, no sync and no real coins.
  dogecoin:
    build: docker/dogecoin
    platform: linux/amd64
    command:
      - -regtest
      - -server
      - -listen=0
      - -txindex
      - -addnode=dogecoin-peer
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcport=18332
      - -rpcuser=pool
      - -rpcpassword=pooldev
    ports:
      - "127.0.0.1:18332:18332"
    volumes:
      - dogecoin:/data
    healthcheck:
      test: ["CMD", "dogecoin-cli", "-regtest", "-rpcport=18332", "-rpcuser=pool", "-rpcpassword=pooldev", "getblockcount"]
      interval: 5s
      timeout: 3s
      retries: 20

  # getblocktemplate refuses to work without at least one connected peer.
  dogecoin-peer:
    build: docker/dogecoin
    platform: linux/amd64
    command:
      - -regtest
      - -listen=1

  # SpaceXpanse regtest. Its default RPC port equals its P2P port, so the RPC port is set explicitly.
  spacexpanse:
    build: docker/spacexpanse
    platform: linux/amd64
    command:
      - -regtest
      - -listen=0
      - -fallbackfee=0.001
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcport=18499
      - -rpcuser=pool
      - -rpcpassword=pooldev
    ports:
      - "127.0.0.1:18499:18499"
    volumes:
      - spacexpanse:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          spacexpanse-cli -regtest -rpcport=18499 -rpcuser=pool -rpcpassword=pooldev getwalletinfo
          || spacexpanse-cli -regtest -rpcport=18499 -rpcuser=pool -rpcpassword=pooldev
          -named createwallet wallet_name=pool load_on_startup=true
      interval: 5s
      timeout: 5s
      retries: 20

  # Test miners, started on demand, e.g.: docker compose --profile miner run --rm miner
  miner:
    build: docker/cpuminer
    profiles: [miner]
    command: ["-a", "scrypt", "-o", "stratum+tcp://host.docker.internal:3333", "-u", "${MINER_ADDRESS:-unset}.rig1", "-p", "${MINER_PASSWORD:-x}", "-t", "1"]

  miner-xaya:
    build: docker/cpuminer-xaya
    profiles: [miner]
    command: ["-a", "neoscrypt", "-o", "stratum+tcp://host.docker.internal:${MINER_PORT:-3334}", "-u", "${MINER_ADDRESS:-unset}.rig1", "-p", "${MINER_PASSWORD:-x}", "-t", "1"]

volumes:
  pgdata:
  dogecoin:
  spacexpanse:
