# Local development against docker-compose.yml. These credentials only exist
# on loopback-bound dev containers; production values never go in this repo.

[database]
url = "postgres://pool:pooldev@127.0.0.1:55432/pool"

# Identifies this stratum process; see config/production.toml for running several.
[instance]
id = 1
region = "Local"
host = "localhost"

# One port per algorithm. Miners pick the coin with "c=<SYMBOL>" in the password;
# without it the coin is recognised from the payout address.
[[stratum]]
listen = "127.0.0.1:3333"
algo = "scrypt"
start_difficulty = 0.1
min_difficulty = 0.001
max_difficulty = 1000000.0
share_target_secs = 15.0

[[stratum]]
listen = "127.0.0.1:3334"
algo = "neoscrypt-xaya"
start_difficulty = 0.01
min_difficulty = 0.0001
max_difficulty = 1000000.0
share_target_secs = 15.0

[[stratum]]
listen = "127.0.0.1:3335"
algo = "rinhash"
start_difficulty = 0.0005
min_difficulty = 0.000001
max_difficulty = 1000000.0
share_target_secs = 15.0

# Low enough for the CPU test miner (cargo run -p pool-stratum --example kawpow_miner).
[[stratum]]
listen = "127.0.0.1:3336"
algo = "kawpow"
start_difficulty = 0.0000001
min_difficulty = 0.000000001
max_difficulty = 1000000.0
share_target_secs = 15.0

[accounting]
pplns_factor = 2.0
pool_fee_percent = 1.0
solo_fee_percent = 1.0
payout_interval_secs = 30

[[coins]]
symbol = "LTC"
price_id = "litecoin"
name = "Litecoin"
algo = "scrypt"
template_rules = ["mweb", "segwit"]
rpc_url = "http://127.0.0.1:19443"
rpc_user = "pool"
rpc_password = "pooldev"
block_maturity = 100
min_payout = 0.1

# Merge-mined: scrypt miners work on Litecoin, and every share is also tried on Dogecoin.
[[coins]]
symbol = "DOGE"
price_id = "dogecoin"
name = "Dogecoin"
algo = "scrypt"
aux_of = "LTC"
rpc_url = "http://127.0.0.1:18332"
rpc_user = "pool"
rpc_password = "pooldev"
block_maturity = 60
min_payout = 1.0

[[coins]]
symbol = "ROD"
price_id = "spacexpanse"
name = "SpaceXpanse"
algo = "neoscrypt-xaya"
chain = "xaya"
rpc_url = "http://127.0.0.1:18499"
rpc_user = "pool"
rpc_password = "pooldev"
# Dev-only: exercises the encrypted-wallet path. Dogecoin above stays unencrypted on purpose.
wallet_passphrase = "pooldev"
block_maturity = 120
min_payout = 1.0

[[coins]]
symbol = "RIN"
name = "Rincoin"
algo = "rinhash"
template_rules = ["mweb", "segwit"]
rpc_url = "http://127.0.0.1:29556"
rpc_user = "pool"
rpc_password = "pooldev"
block_maturity = 100
min_payout = 1.0

[[coins]]
symbol = "RVN"
price_id = "ravencoin"
name = "Ravencoin"
algo = "kawpow"
chain = "ravencoin"
rpc_url = "http://127.0.0.1:18766"
rpc_user = "pool"
rpc_password = "pooldev"
block_maturity = 100
min_payout = 1.0
